# Frozen 2025-baseline parameters for src/processing/hv_segmentation.py.
# Computed once (2026-08-24) from calendar-2025 data in data/raw/monthly_player_data.csv
# and NOT recalculated at runtime — the module only ever reads these values. To refresh,
# re-run the frozen-bar/1-HHI computation against a new baseline year and replace this
# file by hand; there is no code path that regenerates it automatically.
#
# frozen_bar (EUR): 99th percentile of pooled per-player trailing-3-month turnover,
#   across all rolling 3-month windows fully inside calendar 2025 (Jan-Mar .. Oct-Dec,
#   10 windows unless some are dropped per event_months below). null if skip=true.
# inv_hhi_2025: 1/HHI computed on full-calendar-2025 per-player turnover, audit-only —
#   this is what skip is derived from, not something the module recomputes.
# skip: true if inv_hhi_2025 < 30 — brand-product is too concentrated / has too few
#   players for a high-value/regular split to be meaningful. hv_segmentation.py refuses
#   to run a report for a skipped brand-product.
# event_months: calendar months (YYYY-MM) excluded from the frozen_bar's pooled-window
#   calculation because they bring an atypical influx that biases the 99th percentile —
#   e.g. brand_1.lv/sb's 2025-05 major ice hockey event drew a large low-value/one-off
#   betting influx that pulled the bar down. Any rolling window touching a listed month
#   is dropped entirely from the pool, not just that one month's contribution. A
#   reporting month equal to one of these gets event_flag=true in the module's output,
#   so a regular-tier swing that month reads as an event effect, not a trend.

defaults:
  monthly_rate_fraction: 0.3333333333333333  # 1/3 — module parameter default, override per call

